<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="knightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Board Grid Accent in background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
  </g>

  <!-- Golden Crown / Spark Accents -->
  <circle cx="256" cy="118" r="16" fill="url(#goldGrad)" />
  <path d="M256 82 L262 100 L280 106 L262 112 L256 130 L250 112 L232 106 L250 100 Z" fill="#fbbf24" />

  <!-- Iconic Stylized Chess Knight -->
  <path d="M 205 385 L 307 385 C 314 385 320 379 320 372 L 320 358 C 320 351 314 345 307 345 L 298 345 C 298 335 308 315 315 290 C 325 255 315 220 295 190 C 290 183 292 170 298 160 C 285 165 272 165 260 162 C 255 152 245 145 230 145 C 215 145 195 155 185 175 C 172 200 170 225 185 245 C 190 252 188 260 180 265 C 160 278 152 295 155 315 C 158 332 170 345 185 345 L 205 345 Z" 
        fill="url(#knightGrad)" 
        stroke="#0f172a" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Eye & Mane Accents -->
  <circle cx="218" cy="205" r="7" fill="#0f172a" />
  <path d="M 238 230 C 255 250 255 275 245 300" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none" />
  
  <!-- Base Pedestal -->
  <rect x="175" y="388" width="162" height="24" rx="8" fill="url(#goldGrad)" />
</svg>
